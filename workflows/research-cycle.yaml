workflow:
  name: research-cycle
  version: 1
  description: >
    Research phase -- produce, challenge, and validate research.
    Two rounds of peer review, corpus coherence check, cross-system probe.

  inputs:
    topic:
      type: string
      required: true
    flags:
      type: string
      default: ""
      # --landscape: present branch table, stop for user selection
      # --novel: R2 prioritizes preprints, small repos, last 2-3 years

  state:
    file: ".lattice/cycle-state/{{inputs.topic}}.yaml"
    resume_from: current_step
    revision_check: true
    initial:
      phase: research
      current_step: research.0

  # Lock: removed 2026-05-04 (audit MEDIUM-7). See build-cycle.yaml for
  # rationale. acquire-lock / release-lock nodes are the actual mechanism.

  # ── Nodes ──────────────────────────────────────────────────

  nodes:

    # ── Layer 0: Lock ────────────────────────────────────────

    acquire-lock:
      type: bash
      command: bash scripts/acquire-topic-lock.sh "{{inputs.topic}}" "research-cycle"
      on_failure: stop

    # ── Layer 1: Research ────────────────────────────────────

    research:
      type: skill
      skill: lattice/research
      context: inherit
      depends_on: [acquire-lock]
      inputs:
        topic: "{{inputs.topic}}"
        flags: "{{inputs.flags}}"
      gate_check:
        has_corpus_load: "output.contains('Already Known')"
        on_fail: retry
      checkpoint:
        state_key: research.1
        captures: [key_decisions, constraints, output]
      log: true

    landscape-decision:
      type: approval
      depends_on: [research]
      condition: "{{inputs.flags}}.contains('--landscape')"
      prompt: >
        Research produced branch table with coverage scores.
        Which branches should we deep dive?
      options:
        - id: selected
          label: "Branches selected -- proceed to peer review"
        - id: all
          label: "Deep dive all branches"
        - id: abort
          label: "Abort -- rethink scope"
          route: release-lock

    # ── Layer 2: Peer Review R1 ──────────────────────────────

    peer-review-r1:
      type: skill
      skill: lattice/peer-review
      context: fresh                    # Separate agent -- non-negotiable
      depends_on: [research]
      verdict_enum: peer-review
      inputs:
        doc_path: "docs/_internal/research/{{inputs.topic}}.md"
      gate_check:
        min_findings: "count(output.findings) >= 1"
        min_dimensions: "count(output.dimensions) >= 3"
        has_evidence: "all(output.findings, f => f.evidence != null)"
        on_fail: retry
      auto_decision:
        SOUND: proceed
        CONDITIONAL: accept
        FLAWED: accept                  # Accept for incorporation
      checkpoint:
        state_key: research.2
        captures: [findings, verdict]
      log: true

    # ── Layer 3: Incorporate R1 ──────────────────────────────

    incorporate-r1:
      type: skill
      skill: null                       # Inline prompt, no dedicated skill
      context: inherit
      depends_on: [peer-review-r1]
      prompt_append: |
        Incorporate peer review R1 feedback into the research doc.
        - FLAWED: rewrite affected section with corrected science
        - CONDITIONAL: add evidence, narrow assumptions, acknowledge limitations
        - Rejected: note counter-evidence in "Peer Review Notes" section
        The "Peer Review Notes" section is the content marker that incorporation happened.
      inputs:
        research_doc: "docs/_internal/research/{{inputs.topic}}.md"
        review: "docs/_internal/research/peer-reviews/{{inputs.topic}}-review.md"
      checkpoint:
        state_key: research.3
      log: true

    # ── Layer 4: Peer Review R2 ──────────────────────────────

    peer-review-r2:
      type: skill
      skill: lattice/peer-review
      context: fresh                    # Fresh agent -- not the R1 agent
      depends_on: [incorporate-r1]
      verdict_enum: peer-review
      inputs:
        doc_path: "docs/_internal/research/{{inputs.topic}}.md"
        prior_review: "docs/_internal/research/peer-reviews/{{inputs.topic}}-review.md"
        focus: "Check revisions addressed R1 findings. Check for new issues. Don't re-raise addressed findings."
        flags: "{{inputs.flags}}"       # --novel passes through
      gate_check:
        min_findings: "count(output.findings) >= 1"
        min_dimensions: "count(output.dimensions) >= 3"
        on_fail: retry
      auto_decision:
        SOUND: proceed
        CONDITIONAL: accept
      checkpoint:
        state_key: research.4
        captures: [findings, verdict]
      log: true

    # ── Layer 5: Evaluate ────────────────────────────────────

    evaluate:
      type: gate
      depends_on: [peer-review-r2]
      evaluate:
        - condition: "{{nodes.peer-review-r2.output.verdict}} == 'SOUND' || {{nodes.peer-review-r2.output.verdict}} == 'CONDITIONAL'"
          route: distill
        - condition: "{{nodes.peer-review-r2.output.has_new_flawed_on_sound}} == true"
          route: evaluate-bikeshed-arbiter
        - condition: "{{nodes.peer-review-r2.output.has_persistent_flawed}} == true"
          route: evaluate-persistent-arbiter
        - condition: default
          route: distill
      checkpoint:
        state_key: research.5

    # ── Bikeshed arbiter ────────────────────────────────────
    # R2 raised new FLAWED on previously-SOUND material. Classify before
    # escalating: presentation-only objections (wording / emphasis /
    # ordering) auto-side with R1. Only factual disputes backed by
    # testable evidence (source quote, data reference, file:line) reach
    # the user. Preserves substantive R2 catches (fabricated claim,
    # misread source, internal contradiction) while eliminating
    # rubber-stamp gates on stylistic R2 objections.

    evaluate-bikeshed-arbiter:
      type: skill
      skill: null
      context: fresh
      depends_on: [evaluate]
      prompt_append: |
        You are a bikeshed arbiter. Peer review R2 has raised new FLAWED
        finding(s) on material that R1 marked SOUND. Classify each such
        finding into one of three buckets:

        - PRESENTATION_ONLY: R2's objection concerns only wording, ordering,
          emphasis, redundancy, or similar surface presentation. R2 does NOT
          dispute any of R1's factual claims.
        - FACTUAL_DISPUTE: R2 disputes a factual claim -- either by
          introducing a new source, or by reinterpreting a source R1 cited.
          R2 provides testable evidence: a source quote, data reference,
          file:line anchor, or code location that can be verified against
          the actual artifact.
        - FACTUAL_UNSUPPORTED: R2 disputes a factual claim but does NOT
          provide testable evidence for the dispute. R2's counter-claim
          cannot be verified.

        Read R1's review (docs/_internal/research/peer-reviews/{{inputs.topic}}-review.md)
        and R2's findings (captured at peer-review-r2). For each R2 finding
        flagged on previously-SOUND material, output:

          FINDING_ID: [identifier]
          R1_CLAIM: [the factual assertion R1 marked SOUND]
          R2_OBJECTION: [R2's objection summary, 1-2 lines]
          CLASSIFICATION: PRESENTATION_ONLY | FACTUAL_DISPUTE | FACTUAL_UNSUPPORTED
          R2_EVIDENCE: [source quote / data ref / file:line if FACTUAL_DISPUTE; N/A otherwise]

        After all findings, output exactly one summary line:
        ARBITER_VERDICT=auto_side_r1 | escalate_factual

        Decision rule:
        - Any finding classified FACTUAL_DISPUTE -> ARBITER_VERDICT=escalate_factual
        - All findings PRESENTATION_ONLY or FACTUAL_UNSUPPORTED -> ARBITER_VERDICT=auto_side_r1

        Unverifiable objections (FACTUAL_UNSUPPORTED) do not overturn R1's
        analysis -- only testable disputes warrant user attention.
      log: true

    evaluate-bikeshed-route:
      type: gate
      depends_on: [evaluate-bikeshed-arbiter]
      evaluate:
        - condition: "{{nodes.evaluate-bikeshed-arbiter.output}}.contains('ARBITER_VERDICT=auto_side_r1')"
          route: distill
        - condition: default
          route: evaluate-stop-bikeshed

    evaluate-stop-bikeshed:
      type: approval
      depends_on: [evaluate-bikeshed-route]
      prompt: |
        R2 raised factual dispute(s) on previously-SOUND material, with
        testable evidence. The arbiter classified each finding:

        {{nodes.evaluate-bikeshed-arbiter.output}}

        How do you want to proceed?
      options:
        - id: accept-r2
          label: "Accept R2 finding(s) -- re-incorporate revisions"
          route: incorporate-r1
        - id: reject-r2
          label: "Reject R2 -- R1's reading stands"
          route: distill
        - id: abort
          label: "Abort research"
          route: release-lock

    # ── Persistent-FLAWED arbiter ───────────────────────────
    # Same FLAWED finding in both R1 and R2. Not bikeshedding -- both
    # reviewers agree something is wrong but may disagree on what. Diff
    # the evidence items, mark each VERIFIABLE or UNVERIFIABLE (testable
    # against repo/sources), drop unverifiable, compare remaining
    # verifiable evidence. Only direct factual contradiction between
    # verifiable items reaches the user.

    evaluate-persistent-arbiter:
      type: skill
      skill: null
      context: fresh
      depends_on: [evaluate]
      prompt_append: |
        You are a persistent-FLAWED arbiter. Peer review R1 and R2 both
        flagged the same material as FLAWED. Your job is to diff the
        evidence each side cites and determine whether this is a genuine
        contradiction or a resolvable disagreement.

        Read R1's review (docs/_internal/research/peer-reviews/{{inputs.topic}}-review.md)
        and R2's review (captured at peer-review-r2). For each FLAWED
        finding that persists across rounds, enumerate every evidence
        item each side cites (sources, data references, file:line
        anchors, prior decisions, etc.).

        For each evidence item, output:
          ITEM_ID: [identifier]
          SIDE: R1 | R2
          SOURCE: [citation / file:line / decision-log reference]
          VERIFIABLE: YES | NO
          (VERIFIABLE = YES only if you can test the claim against the
           actual artifact -- the source exists, the quote matches, the
           file:line resolves, the prior decision is logged. Partial
           verifiability counts as NO. Do not guess.)
          CONTRADICTS: [IDs of items on the other side whose truth is
                        mutually exclusive with this one; N/A if none]

        After enumerating, output a summary:
          R1 verifiable evidence count: N
          R2 verifiable evidence count: N
          Direct contradictions (verifiable vs verifiable): [list pairs, or none]

        Finally, output exactly one verdict line:
        ARBITER_VERDICT=auto_resolve_r1 | auto_resolve_r2 | auto_synthesize | escalate_contradiction

        Decision rule:
        - R1 has verifiable evidence AND R2 has none (or only unverifiable) -> auto_resolve_r1
        - R2 has verifiable evidence AND R1 has none (or only unverifiable) -> auto_resolve_r2
        - Both sides have verifiable evidence AND no direct contradictions -> auto_synthesize
          (both observations can be true simultaneously; the research doc
          should integrate both framings)
        - Both sides have verifiable evidence AND at least one direct
          contradiction -> escalate_contradiction
        - Neither side has verifiable evidence -> auto_resolve_r1
          (status quo after R1 incorporation stands when the evidence
          ledger is tied at zero; note this in the log)
      log: true

    evaluate-persistent-route:
      type: gate
      depends_on: [evaluate-persistent-arbiter]
      evaluate:
        - condition: "{{nodes.evaluate-persistent-arbiter.output}}.contains('ARBITER_VERDICT=auto_resolve_r1')"
          route: distill
        - condition: "{{nodes.evaluate-persistent-arbiter.output}}.contains('ARBITER_VERDICT=auto_resolve_r2')"
          route: distill
        - condition: "{{nodes.evaluate-persistent-arbiter.output}}.contains('ARBITER_VERDICT=auto_synthesize')"
          route: distill
        - condition: default
          route: evaluate-stop-disagreement

    evaluate-stop-disagreement:
      type: approval
      depends_on: [evaluate-persistent-route]
      prompt: |
        Persistent FLAWED across R1 and R2, with verifiable evidence on
        BOTH sides that directly contradicts. The arbiter's evidence diff:

        {{nodes.evaluate-persistent-arbiter.output}}

        How do you want to proceed?
      options:
        - id: accept-r1
          label: "Side with R1 position"
          route: distill
        - id: accept-r2
          label: "Side with R2 position"
          route: distill
        - id: external
          label: "Need external input"
          route: release-lock

    # ── Layer 6: Distill + Probe (parallel) ──────────────────

    distill:
      type: skill
      skill: lattice/distill
      context: inherit
      depends_on: [evaluate]
      inputs:
        topic: "{{inputs.topic}}"
        mode: "--audit"
      auto_decision:
        contradictions: proceed         # Informational, non-blocking
        clean: proceed
      checkpoint:
        state_key: research.6
        captures: [contradictions, corpus_status]
      log: true

    probe:
      type: skill
      skill: lattice/probe
      context: inherit
      depends_on: [distill]
      verdict_enum: probe
      inputs:
        doc_path: "docs/_internal/research/{{inputs.topic}}.md"
        topic: "{{inputs.topic}}"
      auto_decision:
        SAFE: proceed
        PROPAGATES: proceed
      checkpoint:
        state_key: research.7
        captures: [implications, verdict]
      log: true

    probe-gate:
      type: gate
      depends_on: [probe]
      evaluate:
        - condition: "{{nodes.probe.output.verdict}} == 'SAFE' || {{nodes.probe.output.verdict}} == 'PROPAGATES'"
          route: verify-gaps
        - condition: "{{nodes.probe.output.verdict}} == 'BREAKS'"
          route: probe-stop-breaks
        - condition: "{{nodes.probe.output.verdict}} == 'SCIENCE-FLAG'"
          route: probe-science-memo
        - condition: default
          route: verify-gaps

    probe-stop-breaks:
      type: approval
      depends_on: [probe-gate]
      prompt: >
        Probe detected BREAKS -- cross-system implications that the build plan must account for.
        Affected subsystems listed below.
      options:
        - id: acknowledge
          label: "Acknowledged -- proceed with constraints noted"
          route: verify-gaps
        - id: revise
          label: "Revise research to address breaks"
          route: research                # Loop back
        - id: abort
          label: "Abort"
          route: release-lock

    # ── SCIENCE-FLAG memo resolution ────────────────────────
    # Per the d8dd418 contract: SCIENCE-FLAG resolves by Claude authoring
    # a decision memo with >=3 literature citations, NOT by waiting for
    # an SME. User escalation only when citations cannot be found.
    #
    # The block below is auto-synced from
    # `workflows/_includes/science-flag-resolution.yaml` by
    # `scripts/sync-workflow-includes.py`. DO NOT edit between the markers.
    # To change the protocol: edit the include, run the sync script, then
    # `node executor/dist/cli.js validate`.

    # === BEGIN SCIENCE-FLAG-MEMO (synced from _includes/science-flag-resolution.yaml) ===
    probe-science-memo:
      type: skill
      skill: null
      context: fresh
      depends_on: [probe-gate]
      prompt_append: |
        Probe raised SCIENCE-FLAG on research for topic {{inputs.topic}}
        -- analytical behavior implications detected from cross-system
        propagation analysis. For each flagged item, attempt to author
        a decision memo with at least 3 literature citations that justify
        either accepting the analytical behavior change or rejecting it
        (revise research to address the implication).

        Permitted sources for citations:
        - docs/_internal/knowledge/species-profiles.md
        - docs/_internal/knowledge/vehicle-profiles.md
        - docs/_internal/knowledge/methods-index.md
        - docs/_internal/knowledge/field-contracts.md
        - peer-reviewed research streams in docs/_internal/research/
        - prior validated decisions in .lattice/decisions.log

        For each flag, output:
          FLAG_ID: [identifier from upstream output]
          DESCRIPTION: [what the flag claims would change analytically]
          DECISION: ACCEPT_CHANGE | REJECT_CHANGE
          MEMO_PATH: [decisions.log entry, or research/ doc path if substantive]
          CITATIONS: [list of >=3 cited sources with file:line or paper refs]
          STATUS: RESOLVED | CITATIONS_NOT_FOUND

        If a flag has fewer than 3 verifiable citations after genuine
        search, output STATUS: CITATIONS_NOT_FOUND with a list of what
        you searched and what specific evidence was missing. Do not
        manufacture citations.

        Append RESOLVED memos to .lattice/decisions.log:
        TIMESTAMP\tprobe\tSCIENCE_FLAG_RESOLVED\ttopic={{inputs.topic}}\tflag=<id>\tdecision=<accept|reject>\tcitations=<n>

        Final summary line:
        MEMO_VERDICT=all_resolved | MEMO_VERDICT=partial_unresolved
      log: true

    probe-science-route:
      type: gate
      depends_on: [probe-science-memo]
      evaluate:
        - condition: "{{nodes.probe-science-memo.output}}.contains('MEMO_VERDICT=all_resolved')"
          route: verify-gaps
        - condition: default
          route: probe-stop-science

    probe-stop-science:
      type: approval
      depends_on: [probe-science-route]
      prompt: |
        SCIENCE-FLAG could not be fully resolved via the citation-memo
        path -- one or more flags lacked >=3 verifiable citations after
        genuine search. The arbiter's report:

        {{nodes.probe-science-memo.output}}

        How do you want to proceed?
      options:
        - id: accept
          label: "Accept -- note rationale in commit message"
          route: verify-gaps
        - id: revise
          label: "Reject -- revise research"
          route: research
        - id: abort
          label: "Abort"
          route: release-lock
    # === END SCIENCE-FLAG-MEMO ===

    # ── Layer 7: Verify + Complete ───────────────────────────

    verify-gaps:
      type: skill
      skill: null
      context: inherit
      depends_on: [probe-gate]
      prompt_append: |
        Verify all gaps from the research cycle are persisted:
        1. Read docs/_internal/research/REGISTRY.md -- confirm gaps from research,
           peer review R1/R2, distill audit, and probe are registered.
        2. Read docs/_internal/TODO.md -- confirm data gaps are logged.
        If any gap was mentioned in research/review output but has no entry, write it now.
      checkpoint:
        state_key: research.7b
        captures: [gaps_persisted]

    complete:
      type: bash
      depends_on: [verify-gaps]
      command: bash scripts/release-topic-lock.sh "{{inputs.topic}}" "research-cycle"
      checkpoint:
        state_key: research.complete
        phase: research-complete

    # ── Fallback: Release lock on any abort ──────────────────

    release-lock:
      type: bash
      command: bash scripts/release-topic-lock.sh "{{inputs.topic}}" "research-cycle"
      # Reached via abort routes from approval nodes
