workflow:
  name: build-cycle
  version: 1
  description: >
    Build phase -- design, implement, review, commit.
    Takes a validated blueprint and delivers code.

  inputs:
    topic:
      type: string
      required: false       # Optional if spec_path provided directly
    spec_path:
      type: path
      required: false       # Optional if topic provided (derived from state)
    # One of topic or spec_path must be provided.
    # topic: reads spec path from cycle-state blueprint checkpoint
    # spec_path: direct entry, skips prerequisite check

  state:
    file: ".lattice/cycle-state/{{inputs.topic}}.yaml"
    resume_from: current_step
    revision_check: true
    initial:
      phase: build
      current_step: build.0
    prerequisite:
      phase: blueprint-complete         # Skipped for spec_path entry

  # Lock: removed 2026-05-04 (audit MEDIUM-7). The top-level `lock:` field
  # was descriptive only -- the engine never read it. Locks are acquired
  # and released by the explicit `acquire-lock` / `release-lock` bash
  # nodes below, with ownership checks added in the same audit (CRITICAL-2).

  # ── Nodes ──────────────────────────────────────────────────

  nodes:

    # ── Layer 0: Lock ────────────────────────────────────────

    acquire-lock:
      type: bash
      command: bash scripts/acquire-topic-lock.sh "{{inputs.topic}}" "build-cycle"
      on_failure: stop

    # ── Layer 1: Implement ───────────────────────────────────

    implement:
      type: skill
      skill: lattice/implement
      context: inherit
      depends_on: [acquire-lock]
      inputs:
        spec_path: "{{inputs.spec_path}}"
      # Implement handles its own internal phases:
      #   Phase 0: load and plan
      #   Phase 1-N: for each phase, design (if new UI) -> implement -> ops:check
      #   Phase N+1: compile implementation audit
      # Implement does NOT run review.
      checkpoint:
        state_key: build.1
        captures: [key_decisions, deviations, audit_table]
      log: true

    # ── Layer 1.5: E2E Gate ────────────────────────────────────
    #
    # Branch-comparison behavioral verification. Classifies testability
    # from changed files, then runs suites on base and feature branches
    # and diffs the results. Skipped if no .lattice/e2e.yaml exists or
    # all changes are code_review_only.

    e2e-classify:
      type: bash
      depends_on: [implement]
      command: node "{{env.LATTICE_ROOT}}/executor/dist/cli.js" e2e classify
      capture: stdout
      on_failure: continue

    e2e-gate:
      type: gate
      depends_on: [e2e-classify]
      evaluate:
        - condition: "{{nodes.e2e-classify.output}}.includes('e2e_testable')"
          route: e2e-run
        - condition: default
          route: review

    e2e-run:
      type: bash
      depends_on: [e2e-gate]
      command: node "{{env.LATTICE_ROOT}}/executor/dist/cli.js" e2e run
      timeout: 600000
      on_failure: stop
      checkpoint:
        state_key: build.1.5
      log: true

    # ── Layer 2: Review ──────────────────────────────────────
    #
    # Review now launches 3 agents in parallel (architect-reviewer,
    # decision-auditor, post-impl-reviewer) then converges before
    # mechanical checks. See commands/lattice/review.md Step 1.

    review:
      type: skill
      skill: lattice/review
      context: inherit
      depends_on: [implement, e2e-classify, e2e-run]
      verdict_enum: review
      inputs:
        spec_path: "{{inputs.spec_path}}"
        topic: "{{inputs.topic}}"
      # Review produces 7 mandatory sections:
      #   CHANGES, ARCHITECT REVIEW, DECISION AUDIT,
      #   REQUIREMENT TRACE, MECHANICAL CHECKS, DOCS UPDATE, VERDICT
      # Review offers to commit when all checks pass.
      checkpoint:
        state_key: build.2
        captures: [verdict, commit_hash, gaps_persisted, has_science_flag]
      log: true

    # ── Layer 2.5: Review verdict gate ─────────────────────────
    #
    # Review's overall verdict enum is PASS|FAIL (workflows/verdict-enums.yaml
    # `enums.review`). A SCIENCE-FLAG raised inside review by any agent
    # (architect, decision-auditor, requirement reviewer, peer-reviewer) is
    # surfaced via has_science_flag boolean -- it does NOT collapse into the
    # review verdict. Per CLAUDE.md rule 19, an algorithmic-touching build that
    # raises SCIENCE-FLAG must route to the citation-memo path; without this
    # gate the flag is silent passthrough and reaches `commit` unaddressed.
    # See `docs/skills-includes/science-flag-protocol.md` for the canonical
    # protocol; the memo block below is auto-synced from
    # `workflows/_includes/science-flag-resolution.yaml`.

    review-verdict:
      type: gate
      depends_on: [review]
      evaluate:
        - condition: "{{nodes.review.output.has_science_flag}} == true"
          route: review-science-memo
        - condition: "{{nodes.review.output.verdict}} == 'PASS'"
          route: spec-refresh
        - condition: default
          route: spec-refresh

    # ── SCIENCE-FLAG memo resolution ────────────────────────
    # Per the d8dd418 contract: SCIENCE-FLAG resolves by Claude authoring
    # a decision memo with >=3 literature citations, NOT by waiting for
    # an SME. User escalation only when citations cannot be found.
    #
    # The block below is auto-synced from
    # `workflows/_includes/science-flag-resolution.yaml` by
    # `scripts/sync-workflow-includes.py`. DO NOT edit between the markers.
    # To change the protocol: edit the include, run the sync script, then
    # `node executor/dist/cli.js validate`.

    # === BEGIN SCIENCE-FLAG-MEMO (synced from _includes/science-flag-resolution.yaml) ===
    review-science-memo:
      type: skill
      skill: null
      context: fresh
      depends_on: [review-verdict]
      prompt_append: |
        Review raised SCIENCE-FLAG on the build for topic {{inputs.topic}}
        -- the implementation would change analytical behavior. For each
        flagged item, attempt to author a decision memo with at least 3
        literature citations that justify either accepting the change
        (the new behavior is more correct) or rejecting it (revise the
        implementation to preserve current behavior).

        Permitted sources for citations:
        - docs/_internal/knowledge/species-profiles.md
        - docs/_internal/knowledge/vehicle-profiles.md
        - docs/_internal/knowledge/methods-index.md
        - docs/_internal/knowledge/field-contracts.md
        - peer-reviewed research streams in docs/_internal/research/
        - prior validated decisions in .lattice/decisions.log

        For each flag, output:
          FLAG_ID: [identifier from upstream output]
          DESCRIPTION: [what the flag claims would change analytically]
          DECISION: ACCEPT_CHANGE | REJECT_CHANGE
          MEMO_PATH: [decisions.log entry, or research/ doc path if substantive]
          CITATIONS: [list of >=3 cited sources with file:line or paper refs]
          STATUS: RESOLVED | CITATIONS_NOT_FOUND

        If a flag has fewer than 3 verifiable citations after genuine
        search, output STATUS: CITATIONS_NOT_FOUND with a list of what
        you searched and what specific evidence was missing. Do not
        manufacture citations.

        Append RESOLVED memos to .lattice/decisions.log:
        TIMESTAMP\tbuild\tSCIENCE_FLAG_RESOLVED\ttopic={{inputs.topic}}\tflag=<id>\tdecision=<accept|reject>\tcitations=<n>

        Final summary line:
        MEMO_VERDICT=all_resolved | MEMO_VERDICT=partial_unresolved
      log: true

    review-science-route:
      type: gate
      depends_on: [review-science-memo]
      evaluate:
        - condition: "{{nodes.review-science-memo.output}}.contains('MEMO_VERDICT=all_resolved')"
          route: spec-refresh
        - condition: default
          route: review-stop-science

    review-stop-science:
      type: approval
      depends_on: [review-science-route]
      prompt: |
        SCIENCE-FLAG could not be fully resolved via the citation-memo
        path -- one or more flags lacked >=3 verifiable citations after
        genuine search. The arbiter's report:

        {{nodes.review-science-memo.output}}

        How do you want to proceed?
      options:
        - id: accept
          label: "Accept -- note rationale in commit message"
          route: spec-refresh
        - id: revise
          label: "Revise implementation to preserve current behavior"
          route: implement
        - id: abort
          label: "Abort"
          route: release-lock
    # === END SCIENCE-FLAG-MEMO ===

    # ── Layer 3: Post-Ship Spec Refresh ──────────────────────

    spec-refresh:
      type: skill
      skill: null
      context: inherit
      depends_on: [review-verdict, review-science-route, review-stop-science]
      prompt_append: |
        Post-ship spec refresh. Check whether this implementation invalidates
        downstream specs:
        1. Scan docs/_internal/incoming/ for synthesis docs that depend on
           the subsystems just shipped.
        2. For each: compare field names, module locations, data shape assumptions
           against the actual shipped code.
        3. If mismatches: update the spec in-place, log each correction.
        4. If none found: state "No dependent specs found in incoming/."
      checkpoint:
        state_key: build.3
        captures: [specs_refreshed]

    # ── Layer 4: Complete ────────────────────────────────────

    complete:
      type: bash
      depends_on: [spec-refresh]
      command: bash scripts/release-topic-lock.sh "{{inputs.topic}}" "build-cycle"
      checkpoint:
        state_key: complete
        phase: complete

    # ── Lock release for abort paths ─────────────────────────
    # D1 (2026-05-05): the SCIENCE-FLAG resolution block introduced an `abort`
    # option that routes here. The CRITICAL-1 audit (2026-05-04) noted that a
    # parentless `release-lock` node was placed by Kahn topological sort in
    # Layer 0 and destroyed the topic lock microseconds after acquire-lock
    # took it. The fix: declare an explicit `depends_on` on the science-memo
    # gates that route here, so Kahn places the node downstream of the
    # SCIENCE-FLAG resolution path rather than parentless. The depends_on
    # acknowledges that this node is reached only via routing, not by direct
    # execution sequence -- the executor honors gate routing over depends_on
    # when both are present (see executor/src/engine.ts).

    release-lock:
      type: bash
      depends_on: [review-stop-science]
      command: bash scripts/release-topic-lock.sh "{{inputs.topic}}" "build-cycle"
