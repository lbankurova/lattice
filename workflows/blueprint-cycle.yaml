workflow:
  name: blueprint-cycle
  version: 1
  description: >
    Blueprint phase -- synthesize research into a validated build plan.
    Architect gate, cross-system probe, two rounds of plan review.

  inputs:
    topic:
      type: string
      required: true

  state:
    file: ".lattice/cycle-state/{{inputs.topic}}.yaml"
    resume_from: current_step
    revision_check: true
    initial:
      phase: blueprint
      current_step: blueprint.0
    prerequisite:
      phase: research-complete

  lock:
    type: topic
    key: "{{inputs.topic}}"
    holder: blueprint-cycle

  # ── Nodes ──────────────────────────────────────────────────

  nodes:

    # ── Layer 0: Lock ────────────────────────────────────────

    acquire-lock:
      type: bash
      command: bash scripts/acquire-topic-lock.sh "{{inputs.topic}}" "blueprint-cycle"
      on_failure: stop

    # ── Layer 1: Knowledge Load ──────────────────────────────

    knowledge-load:
      type: skill
      skill: null
      context: inherit
      depends_on: [acquire-lock]
      prompt_append: |
        Implementation knowledge load. Read:
        1. .lattice/decisions.log -- FULL file. Scan for failed approaches,
           architectural constraints, patterns that worked.
        2. .lattice/bug-patterns.md -- known failure families.
        3. docs/_internal/knowledge/code-quality-guardrails.md -- complexity budgets.
        4. .lattice/cycle-state/ -- scan for related completed cycles.
        Output: "Implementation Context" section with findings.
        Gate: if decisions log has FAILED entries relevant to this topic's research,
        they MUST appear in the output.
      gate_check:
        has_context: "output.contains('Implementation Context')"
        on_fail: retry
      checkpoint:
        state_key: blueprint.0
        captures: [failed_approaches, constraints, related_cycles]

    # ── Layer 2: Synthesize ──────────────────────────────────

    synthesize:
      type: skill
      skill: lattice/synthesize
      context: inherit
      depends_on: [knowledge-load]
      inputs:
        topic: "{{inputs.topic}}"
        research_doc: "docs/_internal/research/{{inputs.topic}}.md"
      gate_check:
        has_build_plan: "output.contains('Build Plan')"
        has_reuse: "output.contains('Reuse Inventory')"
        has_simplicity: "output.contains('Simplicity Rationale')"
        has_tests: "output.contains('Test Strategy')"
        has_research_gaps: "output.contains('Research Gaps')"
        has_data_gaps: "output.contains('Data Gaps')"
        # Contract Triangles section is mandatory: list every contract field
        # the build will touch with its declaration/enforcement/consumption
        # sites, OR write "Contract Triangles: none" when no contract surface
        # is touched. CLAUDE.md rule 18; reference docs/_internal/knowledge/
        # contract-triangles.md for the live registry.
        has_contract_triangles: "output.contains('Contract Triangles')"
        on_fail: retry
      checkpoint:
        state_key: blueprint.1
        captures: [key_decisions, proposed_files, output]
      log: true

    # ── Layer 3: Architect Gate + Probe (parallel) ───────────

    architect-and-probe:
      type: parallel
      depends_on: [synthesize]
      nodes: [architect-gate, probe]
      trigger_rule: all_done

    architect-gate:
      type: skill
      skill: null
      context: fresh
      agent_type: architect-reviewer
      inputs:
        synthesis_path: "docs/_internal/incoming/{{inputs.topic}}-synthesis.md"
        guardrails_path: "docs/_internal/knowledge/code-quality-guardrails.md"
        mode: gate
      checkpoint:
        state_key: blueprint.2
        captures: [verdict, simplifications, flags]
      log: true

    probe:
      type: skill
      skill: lattice/probe
      context: inherit
      inputs:
        doc_path: "docs/_internal/incoming/{{inputs.topic}}-synthesis.md"
        topic: "{{inputs.topic}}"
      checkpoint:
        state_key: blueprint.3
        captures: [implications, verdict]
      log: true

    # ── Layer 4: Gate evaluation ─────────────────────────────

    architect-verdict:
      type: gate
      depends_on: [architect-and-probe]
      evaluate:
        - condition: "{{nodes.architect-gate.output.verdict}} == 'PASS' && ({{nodes.probe.output.verdict}} == 'SAFE' || {{nodes.probe.output.verdict}} == 'PROPAGATES')"
          route: plan-review-r1
        - condition: "{{nodes.architect-gate.output.verdict}} == 'SIMPLIFY'"
          route: simplify-and-regate
        - condition: "{{nodes.architect-gate.output.verdict}} == 'REJECT'"
          route: architect-stop-reject
        - condition: "{{nodes.architect-gate.output.verdict}} == 'SCIENCE-FLAG'"
          route: architect-science-memo
        - condition: "{{nodes.probe.output.verdict}} == 'BREAKS'"
          route: probe-stop-breaks
        - condition: "{{nodes.probe.output.verdict}} == 'SCIENCE-FLAG'"
          route: architect-science-memo
        - condition: default
          route: plan-review-r1

    # ── SIMPLIFY auto-apply ─────────────────────────────────
    # The architect-reviewer classifies each finding's Risk: None or
    # Risk: SCIENCE-FLAG. Risk: None items are behavior-preserving by
    # the architect's claim -- user approval is rubber-stamp. Auto-apply,
    # log to decisions.log, re-gate. The downstream simplify-second-verdict
    # gate routes by the second gate's verdict; user only enters the loop
    # on REJECT, SCIENCE-FLAG, or SIMPLIFY-twice (defect: cuts didn't
    # actually simplify).

    simplify-and-regate:
      type: skill
      skill: null
      context: inherit
      depends_on: [architect-verdict]
      prompt_append: |
        Apply the architect's simplification recommendations to the
        synthesis doc. The architect-reviewer agent classified each
        finding as Risk: None (behavior-preserving) or Risk: SCIENCE-FLAG
        (analytical behavior would change). Apply ALL Risk: None cuts
        without user approval -- they are rubber-stamp by construction.

        After applying, append a line to `.lattice/decisions.log`:
        TIMESTAMP\tarchitect\tSIMPLIFY_APPLIED\ttopic={{inputs.topic}}\tcuts=[<list>]\tre-gate=pending

        Then re-run the architect-reviewer agent on the revised synthesis
        with mode=gate. Capture the second-gate verdict.

        Output exactly one line:
        SECOND_GATE_VERDICT=PASS | SECOND_GATE_VERDICT=SIMPLIFY | SECOND_GATE_VERDICT=REJECT | SECOND_GATE_VERDICT=SCIENCE-FLAG

        Followed by the architect-reviewer's full second-gate report.
      checkpoint:
        state_key: blueprint.2b
      log: true

    simplify-second-verdict:
      type: gate
      depends_on: [simplify-and-regate]
      evaluate:
        - condition: "{{nodes.simplify-and-regate.output}}.contains('SECOND_GATE_VERDICT=PASS')"
          route: plan-review-r1
        - condition: "{{nodes.simplify-and-regate.output}}.contains('SECOND_GATE_VERDICT=REJECT')"
          route: architect-stop-reject
        - condition: "{{nodes.simplify-and-regate.output}}.contains('SECOND_GATE_VERDICT=SCIENCE-FLAG')"
          route: architect-science-memo
        - condition: "{{nodes.simplify-and-regate.output}}.contains('SECOND_GATE_VERDICT=SIMPLIFY')"
          route: simplify-stop-twice
        - condition: default
          route: simplify-stop-twice

    simplify-stop-twice:
      type: approval
      depends_on: [simplify-second-verdict]
      prompt: |
        Architect returned SIMPLIFY twice in a row. The first set of cuts
        was auto-applied but did not satisfy the architect on re-gate --
        either the cuts were insufficient or new accidental complexity
        was introduced. This is a defect (architect's recommendations
        should converge in one round when Risk: None).

        Second-gate report:
        {{nodes.simplify-and-regate.output}}

        How do you want to proceed?
      options:
        - id: accept-as-is
          label: "Accept current synthesis -- proceed despite remaining SIMPLIFY findings"
          route: plan-review-r1
        - id: revise
          label: "Revise synthesis manually"
          route: synthesize
        - id: abort
          label: "Abort"
          route: release-lock

    architect-stop-reject:
      type: approval
      depends_on: [architect-verdict]
      prompt: >
        Architect REJECTED the build plan. Alternative approach required.
      options:
        - id: revise
          label: "Revise synthesis"
          route: synthesize
        - id: override
          label: "Override -- proceed anyway"
          route: plan-review-r1
        - id: abort
          label: "Abort"
          route: release-lock

    # ── SCIENCE-FLAG memo resolution ────────────────────────
    # Per the d8dd418 contract: SCIENCE-FLAG resolves by Claude authoring
    # a decision memo with >=3 literature citations, NOT by waiting for
    # an SME. Architect and probe both route SCIENCE-FLAG verdicts here.
    # User escalation only when citations cannot be found.
    #
    # The block below is auto-synced from
    # `workflows/_includes/science-flag-resolution.yaml` by
    # `scripts/sync-workflow-includes.py`. DO NOT edit between the markers.
    # To change the protocol: edit the include, run the sync script, then
    # `node executor/dist/cli.js validate`.

    # === BEGIN SCIENCE-FLAG-MEMO (synced from _includes/science-flag-resolution.yaml) ===
    architect-science-memo:
      type: skill
      skill: null
      context: fresh
      depends_on: [architect-verdict]
      prompt_append: |
        SCIENCE-FLAG raised by architect or probe on the build plan for
        topic {{inputs.topic}}. For each flagged item, attempt to author
        a decision memo with at least 3 literature citations that justify
        either accepting the analytical behavior change or rejecting it
        (revise synthesis to preserve current behavior).

        Permitted sources for citations:
        - docs/_internal/knowledge/species-profiles.md
        - docs/_internal/knowledge/vehicle-profiles.md
        - docs/_internal/knowledge/methods-index.md
        - docs/_internal/knowledge/field-contracts.md
        - peer-reviewed research streams in docs/_internal/research/
        - prior validated decisions in .lattice/decisions.log

        For each flag, output:
          FLAG_ID: [identifier from upstream output]
          DESCRIPTION: [what the flag claims would change analytically]
          DECISION: ACCEPT_CHANGE | REJECT_CHANGE
          MEMO_PATH: [decisions.log entry, or research/ doc path if substantive]
          CITATIONS: [list of >=3 cited sources with file:line or paper refs]
          STATUS: RESOLVED | CITATIONS_NOT_FOUND

        If a flag has fewer than 3 verifiable citations after genuine
        search, output STATUS: CITATIONS_NOT_FOUND with a list of what
        you searched and what specific evidence was missing. Do not
        manufacture citations.

        Append RESOLVED memos to .lattice/decisions.log:
        TIMESTAMP\tarchitect\tSCIENCE_FLAG_RESOLVED\ttopic={{inputs.topic}}\tflag=<id>\tdecision=<accept|reject>\tcitations=<n>

        Final summary line:
        MEMO_VERDICT=all_resolved | MEMO_VERDICT=partial_unresolved
      log: true

    architect-science-route:
      type: gate
      depends_on: [architect-science-memo]
      evaluate:
        - condition: "{{nodes.architect-science-memo.output}}.contains('MEMO_VERDICT=all_resolved')"
          route: plan-review-r1
        - condition: default
          route: architect-stop-science

    architect-stop-science:
      type: approval
      depends_on: [architect-science-route]
      prompt: |
        SCIENCE-FLAG could not be fully resolved via the citation-memo
        path -- one or more flags lacked >=3 verifiable citations after
        genuine search. The arbiter's report:

        {{nodes.architect-science-memo.output}}

        How do you want to proceed?
      options:
        - id: accept
          label: "Accept -- note rationale in commit message"
          route: plan-review-r1
        - id: revise
          label: "Reject -- revise synthesis to preserve current behavior"
          route: synthesize
        - id: abort
          label: "Abort"
          route: release-lock
    # === END SCIENCE-FLAG-MEMO ===

    probe-stop-breaks:
      type: approval
      depends_on: [architect-verdict]
      prompt: >
        Probe detected BREAKS. Build plan must account for affected subsystems.
      options:
        - id: acknowledge
          label: "Acknowledged -- update synthesis scope"
          route: synthesize
        - id: proceed
          label: "Proceed -- breaks are acceptable"
          route: plan-review-r1
        - id: abort
          label: "Abort"
          route: release-lock

    # ── Layer 5: Plan Review R1 ──────────────────────────────

    plan-review-r1:
      type: skill
      skill: lattice/peer-review
      context: fresh
      depends_on: [architect-verdict]
      inputs:
        doc_path: "docs/_internal/incoming/{{inputs.topic}}-synthesis.md"
      gate_check:
        min_findings: "count(output.findings) >= 1"
        min_dimensions: "count(output.dimensions) >= 3"
        on_fail: retry
      auto_decision:
        SOUND: proceed
        CONDITIONAL: accept
        FLAWED: accept
      checkpoint:
        state_key: blueprint.4
        captures: [findings, verdict]
      log: true

    # ── Layer 6: Incorporate ─────────────────────────────────

    incorporate-plan:
      type: skill
      skill: null
      context: inherit
      depends_on: [plan-review-r1]
      prompt_append: |
        Incorporate plan review R1 feedback into the synthesis doc.
        - FLAWED: rewrite affected section of the synthesis
        - CONDITIONAL: strengthen evidence, narrow scope, add caveats
        - Rejected: note counter-evidence in "Plan Review Notes" section
      inputs:
        synthesis: "docs/_internal/incoming/{{inputs.topic}}-synthesis.md"
        review: "docs/_internal/research/peer-reviews/{{inputs.topic}}-synthesis-review.md"
      checkpoint:
        state_key: blueprint.5
      log: true

    # ── Layer 7: Plan Review R2 ──────────────────────────────

    plan-review-r2:
      type: skill
      skill: lattice/peer-review
      context: fresh
      depends_on: [incorporate-plan]
      inputs:
        doc_path: "docs/_internal/incoming/{{inputs.topic}}-synthesis.md"
        prior_review: "docs/_internal/research/peer-reviews/{{inputs.topic}}-synthesis-review.md"
        focus: "Check revisions addressed R1 findings. Check for new issues. Don't re-raise addressed findings."
      gate_check:
        min_findings: "count(output.findings) >= 1"
        min_dimensions: "count(output.dimensions) >= 3"
        on_fail: retry
      auto_decision:
        SOUND: proceed
        CONDITIONAL: accept
      checkpoint:
        state_key: blueprint.6
        captures: [findings, verdict]
      log: true

    # ── Layer 8: Evaluate R2 ─────────────────────────────────

    plan-evaluate:
      type: gate
      depends_on: [plan-review-r2]
      evaluate:
        - condition: "{{nodes.plan-review-r2.output.verdict}} == 'SOUND' || {{nodes.plan-review-r2.output.verdict}} == 'CONDITIONAL'"
          route: verify-gaps
        - condition: "{{nodes.plan-review-r2.output.has_new_flawed_on_sound}} == true"
          route: plan-bikeshed-arbiter
        - condition: "{{nodes.plan-review-r2.output.has_persistent_flawed}} == true"
          route: plan-persistent-arbiter
        - condition: default
          route: verify-gaps

    # ── Bikeshed arbiter ────────────────────────────────────
    # Plan review R2 raised new FLAWED on previously-SOUND material.
    # Classify before escalating: presentation-only objections auto-side
    # with R1; only factual disputes backed by testable evidence reach
    # the user. Preserves substantive R2 catches while eliminating
    # rubber-stamp gates on stylistic R2 objections.

    plan-bikeshed-arbiter:
      type: skill
      skill: null
      context: fresh
      depends_on: [plan-evaluate]
      prompt_append: |
        You are a bikeshed arbiter for plan review. R2 raised new FLAWED
        finding(s) on plan material that R1 marked SOUND. Classify each
        such finding into one of three buckets:

        - PRESENTATION_ONLY: R2's objection concerns only wording, ordering,
          emphasis, redundancy, or similar surface presentation. R2 does NOT
          dispute R1's factual claims about the plan.
        - FACTUAL_DISPUTE: R2 disputes a factual claim -- either by
          introducing a new source (spec, research finding, prior decision,
          code reference), or by reinterpreting a source R1 cited. R2
          provides testable evidence: source quote, data reference,
          file:line, or prior-decision reference that can be verified.
        - FACTUAL_UNSUPPORTED: R2 disputes a factual claim but does NOT
          provide testable evidence for the dispute.

        Read R1's review (docs/_internal/research/peer-reviews/{{inputs.topic}}-synthesis-review.md)
        and R2's findings (captured at plan-review-r2). For each R2 finding
        flagged on previously-SOUND material, output:

          FINDING_ID: [identifier]
          R1_CLAIM: [the factual assertion R1 marked SOUND]
          R2_OBJECTION: [R2's objection summary, 1-2 lines]
          CLASSIFICATION: PRESENTATION_ONLY | FACTUAL_DISPUTE | FACTUAL_UNSUPPORTED
          R2_EVIDENCE: [source quote / file:line / prior-decision ref if FACTUAL_DISPUTE; N/A otherwise]

        After all findings, output exactly one summary line:
        ARBITER_VERDICT=auto_side_r1 | escalate_factual

        Decision rule:
        - Any finding classified FACTUAL_DISPUTE -> ARBITER_VERDICT=escalate_factual
        - All findings PRESENTATION_ONLY or FACTUAL_UNSUPPORTED -> ARBITER_VERDICT=auto_side_r1

        Unverifiable objections (FACTUAL_UNSUPPORTED) do not overturn R1's
        analysis -- only testable disputes warrant user attention.
      log: true

    plan-bikeshed-route:
      type: gate
      depends_on: [plan-bikeshed-arbiter]
      evaluate:
        - condition: "{{nodes.plan-bikeshed-arbiter.output}}.contains('ARBITER_VERDICT=auto_side_r1')"
          route: verify-gaps
        - condition: default
          route: plan-stop-bikeshed

    plan-stop-bikeshed:
      type: approval
      depends_on: [plan-bikeshed-route]
      prompt: |
        R2 raised factual dispute(s) on previously-SOUND plan material,
        with testable evidence. The arbiter classified each finding:

        {{nodes.plan-bikeshed-arbiter.output}}

        How do you want to proceed?
      options:
        - id: accept-r2
          label: "Accept R2 finding(s) -- re-incorporate revisions"
          route: incorporate-plan
        - id: reject-r2
          label: "Reject R2 -- R1's reading stands"
          route: verify-gaps

    # ── Persistent-FLAWED arbiter ───────────────────────────
    # Same FLAWED finding in both plan review R1 and R2. Not bikeshedding
    # -- both reviewers agree something is wrong. Diff evidence, mark
    # verifiable vs unverifiable against sources, only direct factual
    # contradiction between verifiable items reaches the user.

    plan-persistent-arbiter:
      type: skill
      skill: null
      context: fresh
      depends_on: [plan-evaluate]
      prompt_append: |
        You are a persistent-FLAWED arbiter for plan review. R1 and R2
        both flagged the same plan material as FLAWED. Diff the evidence
        each side cites and determine whether this is a genuine
        contradiction or a resolvable disagreement.

        Read R1's plan review (docs/_internal/research/peer-reviews/{{inputs.topic}}-synthesis-review.md)
        and R2's plan review (captured at plan-review-r2). For each FLAWED
        finding that persists across rounds, enumerate every evidence item
        each side cites (sources, research docs, prior decisions, code
        references, file:line anchors, etc.).

        For each evidence item, output:
          ITEM_ID: [identifier]
          SIDE: R1 | R2
          SOURCE: [citation / file:line / decision-log ref / research-doc ref]
          VERIFIABLE: YES | NO
          (VERIFIABLE = YES only if you can test the claim against the
           actual artifact -- the source exists, the quote matches, the
           file:line resolves, the prior decision is logged. Partial
           verifiability counts as NO. Do not guess.)
          CONTRADICTS: [IDs of items on the other side whose truth is
                        mutually exclusive with this one; N/A if none]

        After enumerating, output a summary:
          R1 verifiable evidence count: N
          R2 verifiable evidence count: N
          Direct contradictions (verifiable vs verifiable): [list pairs, or none]

        Finally, output exactly one verdict line:
        ARBITER_VERDICT=auto_resolve_r1 | auto_resolve_r2 | auto_synthesize | escalate_contradiction

        Decision rule:
        - R1 has verifiable evidence AND R2 has none (or only unverifiable) -> auto_resolve_r1
        - R2 has verifiable evidence AND R1 has none (or only unverifiable) -> auto_resolve_r2
        - Both sides have verifiable evidence AND no direct contradictions -> auto_synthesize
          (both observations can be true simultaneously; the synthesis
          should integrate both framings)
        - Both sides have verifiable evidence AND at least one direct
          contradiction -> escalate_contradiction
        - Neither side has verifiable evidence -> auto_resolve_r1
          (status quo after R1 incorporation stands when the evidence
          ledger is tied at zero; note this in the log)
      log: true

    plan-persistent-route:
      type: gate
      depends_on: [plan-persistent-arbiter]
      evaluate:
        - condition: "{{nodes.plan-persistent-arbiter.output}}.contains('ARBITER_VERDICT=auto_resolve_r1')"
          route: verify-gaps
        - condition: "{{nodes.plan-persistent-arbiter.output}}.contains('ARBITER_VERDICT=auto_resolve_r2')"
          route: verify-gaps
        - condition: "{{nodes.plan-persistent-arbiter.output}}.contains('ARBITER_VERDICT=auto_synthesize')"
          route: verify-gaps
        - condition: default
          route: plan-stop-disagreement

    plan-stop-disagreement:
      type: approval
      depends_on: [plan-persistent-route]
      prompt: |
        Persistent FLAWED across plan review R1 and R2, with verifiable
        evidence on BOTH sides that directly contradicts. The arbiter's
        evidence diff:

        {{nodes.plan-persistent-arbiter.output}}

        How do you want to proceed?
      options:
        - id: r1
          label: "Side with R1"
          route: verify-gaps
        - id: r2
          label: "Side with R2"
          route: verify-gaps
        - id: abort
          label: "Abort"
          route: release-lock

    # ── Layer 9: Verify + Complete ───────────────────────────

    verify-gaps:
      type: skill
      skill: null
      context: inherit
      depends_on: [plan-evaluate]
      prompt_append: |
        Verify all gaps from the blueprint cycle are persisted:
        1. Read REGISTRY.md -- confirm research gaps from synthesis Section 2.
        2. Read TODO.md -- confirm data gaps from synthesis Section 3.
        Gaps only in the synthesis are not persisted -- synthesis gets archived.
      checkpoint:
        state_key: blueprint.7
        captures: [gaps_persisted]

    complete:
      type: bash
      depends_on: [verify-gaps]
      command: bash scripts/release-topic-lock.sh "{{inputs.topic}}"
      checkpoint:
        state_key: build.0
        phase: blueprint-complete

    release-lock:
      type: bash
      command: bash scripts/release-topic-lock.sh "{{inputs.topic}}"
