workflow:
  name: blueprint-cycle
  version: 1
  description: >
    Blueprint phase -- synthesize research into a validated build plan.
    Architect gate, cross-system probe, two rounds of plan review.

  inputs:
    topic:
      type: string
      required: true

  state:
    file: ".lattice/cycle-state/{{inputs.topic}}.yaml"
    resume_from: current_step
    revision_check: true
    initial:
      phase: blueprint
      current_step: blueprint.0
    prerequisite:
      phase: research-complete

  lock:
    type: topic
    key: "{{inputs.topic}}"
    holder: blueprint-cycle

  # ── Nodes ──────────────────────────────────────────────────

  nodes:

    # ── Layer 0: Lock ────────────────────────────────────────

    acquire-lock:
      type: bash
      command: bash scripts/acquire-topic-lock.sh "{{inputs.topic}}" "blueprint-cycle"
      on_failure: stop

    # ── Layer 1: Knowledge Load ──────────────────────────────

    knowledge-load:
      type: skill
      skill: null
      context: inherit
      depends_on: [acquire-lock]
      prompt_append: |
        Implementation knowledge load. Read:
        1. .lattice/decisions.log -- FULL file. Scan for failed approaches,
           architectural constraints, patterns that worked.
        2. .lattice/bug-patterns.md -- known failure families.
        3. docs/_internal/knowledge/code-quality-guardrails.md -- complexity budgets.
        4. .lattice/cycle-state/ -- scan for related completed cycles.
        Output: "Implementation Context" section with findings.
        Gate: if decisions log has FAILED entries relevant to this topic's research,
        they MUST appear in the output.
      gate_check:
        has_context: "output.contains('Implementation Context')"
        on_fail: retry
      checkpoint:
        state_key: blueprint.0
        captures: [failed_approaches, constraints, related_cycles]

    # ── Layer 2: Synthesize ──────────────────────────────────

    synthesize:
      type: skill
      skill: lattice/synthesize
      context: inherit
      depends_on: [knowledge-load]
      inputs:
        topic: "{{inputs.topic}}"
        research_doc: "docs/_internal/research/{{inputs.topic}}.md"
      gate_check:
        has_build_plan: "output.contains('Build Plan')"
        has_reuse: "output.contains('Reuse Inventory')"
        has_simplicity: "output.contains('Simplicity Rationale')"
        has_tests: "output.contains('Test Strategy')"
        has_research_gaps: "output.contains('Research Gaps')"
        has_data_gaps: "output.contains('Data Gaps')"
        on_fail: retry
      checkpoint:
        state_key: blueprint.1
        captures: [key_decisions, proposed_files, output]
      log: true

    # ── Layer 3: Architect Gate + Probe (parallel) ───────────

    architect-and-probe:
      type: parallel
      depends_on: [synthesize]
      nodes: [architect-gate, probe]
      trigger_rule: all_done

    architect-gate:
      type: skill
      skill: null
      context: fresh
      agent_type: architect-reviewer
      inputs:
        synthesis_path: "docs/_internal/incoming/{{inputs.topic}}-synthesis.md"
        guardrails_path: "docs/_internal/knowledge/code-quality-guardrails.md"
        mode: gate
      checkpoint:
        state_key: blueprint.2
        captures: [verdict, simplifications, flags]
      log: true

    probe:
      type: skill
      skill: lattice/probe
      context: inherit
      inputs:
        doc_path: "docs/_internal/incoming/{{inputs.topic}}-synthesis.md"
        topic: "{{inputs.topic}}"
      checkpoint:
        state_key: blueprint.3
        captures: [implications, verdict]
      log: true

    # ── Layer 4: Gate evaluation ─────────────────────────────

    architect-verdict:
      type: gate
      depends_on: [architect-and-probe]
      evaluate:
        - condition: "{{nodes.architect-gate.output.verdict}} == 'PASS' && ({{nodes.probe.output.verdict}} == 'SAFE' || {{nodes.probe.output.verdict}} == 'PROPAGATES')"
          route: plan-review-r1
        - condition: "{{nodes.architect-gate.output.verdict}} == 'SIMPLIFY'"
          route: simplify-and-regate
        - condition: "{{nodes.architect-gate.output.verdict}} == 'REJECT'"
          route: architect-stop-reject
        - condition: "{{nodes.architect-gate.output.verdict}} == 'SCIENCE-FLAG'"
          route: architect-stop-science
        - condition: "{{nodes.probe.output.verdict}} == 'BREAKS'"
          route: probe-stop-breaks
        - condition: "{{nodes.probe.output.verdict}} == 'SCIENCE-FLAG'"
          route: architect-stop-science
        - condition: default
          route: plan-review-r1

    simplify-and-regate:
      type: skill
      skill: null
      context: inherit
      depends_on: [architect-verdict]
      prompt_append: |
        Apply architect's simplification recommendations to the synthesis doc.
        Then re-run architect gate. If second gate is PASS, proceed.
        If still SIMPLIFY or worse, STOP for user.
      auto_decision:
        PASS: proceed
      checkpoint:
        state_key: blueprint.2b

    architect-stop-reject:
      type: approval
      depends_on: [architect-verdict]
      prompt: >
        Architect REJECTED the build plan. Alternative approach required.
      options:
        - id: revise
          label: "Revise synthesis"
          route: synthesize
        - id: override
          label: "Override -- proceed anyway"
          route: plan-review-r1
        - id: abort
          label: "Abort"
          route: release-lock

    architect-stop-science:
      type: approval
      depends_on: [architect-verdict]
      prompt: >
        SCIENCE-FLAG raised. Analytical behavior changes need scientist review.
        Each flag requires explicit accept or reject.
      options:
        - id: accept
          label: "Accept all flags"
          route: plan-review-r1
        - id: reject
          label: "Reject -- revise synthesis"
          route: synthesize
        - id: abort
          label: "Abort"
          route: release-lock

    probe-stop-breaks:
      type: approval
      depends_on: [architect-verdict]
      prompt: >
        Probe detected BREAKS. Build plan must account for affected subsystems.
      options:
        - id: acknowledge
          label: "Acknowledged -- update synthesis scope"
          route: synthesize
        - id: proceed
          label: "Proceed -- breaks are acceptable"
          route: plan-review-r1
        - id: abort
          label: "Abort"
          route: release-lock

    # ── Layer 5: Plan Review R1 ──────────────────────────────

    plan-review-r1:
      type: skill
      skill: lattice/peer-review
      context: fresh
      depends_on: [architect-verdict]
      inputs:
        doc_path: "docs/_internal/incoming/{{inputs.topic}}-synthesis.md"
      gate_check:
        min_findings: "count(output.findings) >= 1"
        min_dimensions: "count(output.dimensions) >= 3"
        on_fail: retry
      auto_decision:
        SOUND: proceed
        CONDITIONAL: accept
        FLAWED: accept
      checkpoint:
        state_key: blueprint.4
        captures: [findings, verdict]
      log: true

    # ── Layer 6: Incorporate ─────────────────────────────────

    incorporate-plan:
      type: skill
      skill: null
      context: inherit
      depends_on: [plan-review-r1]
      prompt_append: |
        Incorporate plan review R1 feedback into the synthesis doc.
        - FLAWED: rewrite affected section of the synthesis
        - CONDITIONAL: strengthen evidence, narrow scope, add caveats
        - Rejected: note counter-evidence in "Plan Review Notes" section
      inputs:
        synthesis: "docs/_internal/incoming/{{inputs.topic}}-synthesis.md"
        review: "docs/_internal/research/peer-reviews/{{inputs.topic}}-synthesis-review.md"
      checkpoint:
        state_key: blueprint.5
      log: true

    # ── Layer 7: Plan Review R2 ──────────────────────────────

    plan-review-r2:
      type: skill
      skill: lattice/peer-review
      context: fresh
      depends_on: [incorporate-plan]
      inputs:
        doc_path: "docs/_internal/incoming/{{inputs.topic}}-synthesis.md"
        prior_review: "docs/_internal/research/peer-reviews/{{inputs.topic}}-synthesis-review.md"
        focus: "Check revisions addressed R1 findings. Check for new issues. Don't re-raise addressed findings."
      gate_check:
        min_findings: "count(output.findings) >= 1"
        min_dimensions: "count(output.dimensions) >= 3"
        on_fail: retry
      auto_decision:
        SOUND: proceed
        CONDITIONAL: accept
      checkpoint:
        state_key: blueprint.6
        captures: [findings, verdict]
      log: true

    # ── Layer 8: Evaluate R2 ─────────────────────────────────

    plan-evaluate:
      type: gate
      depends_on: [plan-review-r2]
      evaluate:
        - condition: "{{nodes.plan-review-r2.output.verdict}} == 'SOUND' || {{nodes.plan-review-r2.output.verdict}} == 'CONDITIONAL'"
          route: verify-gaps
        - condition: "{{nodes.plan-review-r2.output.has_new_flawed_on_sound}} == true"
          route: plan-stop-bikeshed
        - condition: "{{nodes.plan-review-r2.output.has_persistent_flawed}} == true"
          route: plan-stop-disagreement
        - condition: default
          route: verify-gaps

    plan-stop-bikeshed:
      type: approval
      depends_on: [plan-evaluate]
      prompt: "R2 raised new FLAWED on previously-SOUND material. Likely bikeshedding."
      options:
        - id: accept-r2
          label: "Accept R2 finding"
          route: incorporate-plan
        - id: reject-r2
          label: "Reject -- original was correct"
          route: verify-gaps

    plan-stop-disagreement:
      type: approval
      depends_on: [plan-evaluate]
      prompt: "Same FLAWED persists across both rounds. Genuine disagreement."
      options:
        - id: r1
          label: "Side with R1"
          route: verify-gaps
        - id: r2
          label: "Side with R2"
          route: verify-gaps
        - id: abort
          label: "Abort"
          route: release-lock

    # ── Layer 9: Verify + Complete ───────────────────────────

    verify-gaps:
      type: skill
      skill: null
      context: inherit
      depends_on: [plan-evaluate]
      prompt_append: |
        Verify all gaps from the blueprint cycle are persisted:
        1. Read REGISTRY.md -- confirm research gaps from synthesis Section 2.
        2. Read TODO.md -- confirm data gaps from synthesis Section 3.
        Gaps only in the synthesis are not persisted -- synthesis gets archived.
      checkpoint:
        state_key: blueprint.7
        captures: [gaps_persisted]

    complete:
      type: bash
      depends_on: [verify-gaps]
      command: bash scripts/release-topic-lock.sh "{{inputs.topic}}"
      checkpoint:
        state_key: build.0
        phase: blueprint-complete

    release-lock:
      type: bash
      command: bash scripts/release-topic-lock.sh "{{inputs.topic}}"
