workflow:
  name: cycle
  version: 1
  description: >
    Meta-orchestrator -- classifies work, auto-detects phase from state,
    dispatches to the right sub-cycle workflow.
    Two paths: full cycle (research > blueprint > build) for new/complex work,
    spike cycle (spike > spec-from-code > review) for known-territory work.

  inputs:
    topic:
      type: string
      required: true
    force:
      type: boolean
      default: false
    mode:
      type: string
      default: auto
      # auto: orchestrator classifies and recommends
      # spike: force spike cycle
      # full: force full cycle
      # bugfix: force bug-fix cycle

  state:
    file: ".lattice/cycle-state/{{inputs.topic}}.yaml"
    resume_from: current_step

  # No lock at this level -- sub-cycles manage their own locks.
  # Cycle dispatcher only reads state, classifies, and routes.

  # ── Nodes ──────────────────────────────────────────────────

  nodes:

    # ── Layer 0: Deduplication ───────────────────────────────

    dedup-check:
      type: bash
      command: |
        RECENT=$(grep -P "COMPLETED\t{{inputs.topic}}" .lattice/decisions.log 2>/dev/null | tail -5)
        if [ -n "$RECENT" ]; then
          LAST_TIME=$(echo "$RECENT" | tail -1 | cut -f1)
          echo "RECENT_COMPLETION=$LAST_TIME"
          echo "$RECENT"
        else
          echo "NO_RECENT_COMPLETION"
        fi
      on_failure: continue

    dedup-gate:
      type: gate
      depends_on: [dedup-check]
      evaluate:
        - condition: "{{inputs.force}} == true"
          route: detect-phase
        - condition: "{{nodes.dedup-check.output}}.contains('NO_RECENT_COMPLETION')"
          route: bundled-dedup-check
        - condition: default
          route: dedup-approval

    dedup-approval:
      type: approval
      depends_on: [dedup-gate]
      prompt: >
        Topic {{inputs.topic}} was recently completed.
        Are you sure you want to re-run?
      options:
        - id: yes
          label: "Yes, re-run"
          route: detect-phase
        - id: no
          label: "No, abort"
          route: cycle-aborted

    # Bundled-cycle dedup. Catches the case where {{inputs.topic}} (e.g.
    # GAP-VEHICLE-2) was scoped inside a parent bundle (e.g. gap-vehicle).
    # Direct grep above only matches `COMPLETED\t{{topic}}` literally, so
    # bundled completions slip past it. find-bundled-cycle.sh scans every
    # cycle-state YAML's `scope:` array. Exit 0 = match (output is
    # `<bundled_topic>\t<phase>\t<state_file>`); exit 1 = no match.

    bundled-dedup-check:
      type: bash
      command: |
        if BUNDLED=$(bash scripts/find-bundled-cycle.sh "{{inputs.topic}}" 2>/dev/null); then
          echo "BUNDLED_MATCH"
          echo "$BUNDLED"
        else
          echo "NO_BUNDLED_MATCH"
        fi
      on_failure: continue

    bundled-dedup-gate:
      type: gate
      depends_on: [bundled-dedup-check]
      evaluate:
        - condition: "{{nodes.bundled-dedup-check.output}}.contains('NO_BUNDLED_MATCH')"
          route: detect-phase
        - condition: default
          route: bundled-dedup-approval

    bundled-dedup-approval:
      type: approval
      depends_on: [bundled-dedup-gate]
      prompt: >
        Topic {{inputs.topic}} is covered by a bundled parent cycle
        (see bundled-dedup-check output for {bundled_topic}, phase, file).
        If phase is `complete`, re-running is almost certainly wrong;
        verify against the parent's COMPLETED entry first.
        If phase is in-flight, you usually want
        `/lattice:cycle {bundled_topic}` to resume the bundle.
        Override?
      options:
        - id: bundle
          label: "Resume bundled parent cycle (recommended for in-flight)"
          route: cycle-aborted
        - id: force
          label: "Start independent cycle for {{inputs.topic}} anyway"
          route: detect-phase
        - id: no
          label: "Abort"
          route: cycle-aborted

    cycle-aborted:
      type: bash
      command: echo "Cycle aborted by user for {{inputs.topic}}."

    # ── Layer 1: Phase Detection ─────────────────────────────
    #
    # If state exists, resume the active cycle (no classification needed).
    # Classification only runs for NEW topics (no state file).

    detect-phase:
      type: gate
      depends_on: [dedup-gate]
      evaluate:
        # Existing state -- resume active cycle
        - condition: "{{state.phase}} == 'bugfix'"
          route: dispatch-bugfix
        - condition: "{{state.phase}} == 'spike'"
          route: dispatch-spike
        - condition: "{{state.phase}} == 'research'"
          route: dispatch-research
        - condition: "{{state.phase}} == 'research-complete'"
          route: dispatch-blueprint
        - condition: "{{state.phase}} == 'blueprint'"
          route: dispatch-blueprint
        - condition: "{{state.phase}} == 'blueprint-complete'"
          route: dispatch-build
        - condition: "{{state.phase}} == 'build'"
          route: dispatch-build
        - condition: "{{state.phase}} == 'complete'"
          route: already-complete
        # No state file -- needs classification
        - condition: default
          route: classify

    # ── Layer 1b: Classification (new topics only) ───────────
    #
    # Determines whether to run the full cycle or the spike cycle.
    # Evaluates: scope, domain novelty, engine impact, user override.

    classify:
      type: gate
      depends_on: [detect-phase]
      evaluate:
        # User forced a mode
        - condition: "{{inputs.mode}} == 'bugfix'"
          route: dispatch-bugfix
        - condition: "{{inputs.mode}} == 'spike'"
          route: dispatch-spike
        - condition: "{{inputs.mode}} == 'full'"
          route: dispatch-research
        # Auto-classification: check for signals that need full cycle
        - condition: default
          route: classify-auto

    classify-auto:
      type: skill
      skill: null
      context: inherit
      depends_on: [classify]
      prompt_append: |
        Classify whether topic "{{inputs.topic}}" needs the full research cycle
        or can use the lightweight spike cycle. Evaluate these signals:

        **Bug fix indicators** (any one = recommend bugfix):
        - Topic describes a defect, broken behavior, or regression
        - Keywords: "bug", "fix", "broken", "wrong", "crash", "error", "empty",
          "stale", "missing", "incorrect", "doesn't work", "fails"
        - References a BUG-NNN ID from BUG-SWEEP.md
        - Describes what IS happening vs what SHOULD happen

        **Full cycle indicators** (any one = recommend full):
        - New analytical capability or scoring change
        - Touches engine/pipeline modules (classification.py, findings_pipeline.py,
          statistics.py, scores_and_rules.py, syndrome rules, cross-domain syndromes)
        - New domain or subsystem not previously built
        - Cross-subsystem changes (3+ subsystems affected)
        - Scientific method decisions needed (statistical tests, thresholds, normalization)
        - User's topic description mentions research, investigation, or "how should we..."

        **Spike cycle indicators** (all must hold):
        - Work is in known territory (existing view, existing subsystem)
        - No new scientific method decisions
        - Scope is bounded (single view, single feature)
        - Existing patterns cover the approach (reuse > invent)

        Check:
        1. Does the topic description sound like a bug report?
        2. Does docs/_internal/BUG-SWEEP.md have an existing entry for this?
        3. Does docs/_internal/research/ have existing research on this topic?
        4. Does the topic name suggest engine/pipeline work?
        5. Is there an existing spec in docs/_internal/incoming/ for this?

        Decision rules (apply in priority order):
        1. If bug signals match AND no full-cycle signals match -> RECOMMEND=bugfix
        2. If any full-cycle signal matches (engine / scientific method / cross-subsystem) -> RECOMMEND=full
           (This applies even when bug signals also match -- engine changes need full ceremony.)
        3. If ALL spike signals hold AND no bug/full signals match -> RECOMMEND=spike
        4. If signals conflict in a way not covered above, or none match -> RECOMMEND=ambiguous

        Output exactly one line: RECOMMEND=bugfix | RECOMMEND=spike | RECOMMEND=full | RECOMMEND=ambiguous
        Then 2-3 bullet justification citing the specific signals observed.
        If RECOMMEND=ambiguous, state which two paths are plausible and which one you lean toward.

    classify-route:
      type: gate
      depends_on: [classify-auto]
      evaluate:
        - condition: "{{nodes.classify-auto.output}}.contains('RECOMMEND=bugfix')"
          route: dispatch-bugfix
        - condition: "{{nodes.classify-auto.output}}.contains('RECOMMEND=spike')"
          route: dispatch-spike
        - condition: "{{nodes.classify-auto.output}}.contains('RECOMMEND=full')"
          route: dispatch-research
        # RECOMMEND=ambiguous or anything unexpected falls through to user confirmation.
        - condition: default
          route: classify-ambiguous-approval

    classify-ambiguous-approval:
      type: approval
      depends_on: [classify-route]
      prompt: |
        Classification for "{{inputs.topic}}" is ambiguous -- signals support multiple paths.

        {{nodes.classify-auto.output}}

        Confirm or override. (For explicit no-prompt dispatch next time, use --full / --spike / --bugfix.)
      options:
        - id: bugfix
          label: "Bug fix cycle (classify > investigate > fix > stress > review)"
          route: dispatch-bugfix
        - id: spike
          label: "Spike cycle (spike > spec-from-code > review)"
          route: dispatch-spike
        - id: full
          label: "Full cycle (research > blueprint > build)"
          route: dispatch-research
        - id: build-only
          label: "Build only (have a spec already)"
          route: dispatch-build

    # ── Layer 2: Phase transitions ───────────────────────────
    # Phase transitions are deterministic -- detect-phase routes
    # {research,blueprint}-complete states directly to the next
    # dispatch node. No approval gates. To pause a topic in batch
    # mode, set lifecycle_state: paused in its state file (autopilot
    # honors this). Direct /lattice:cycle invocation advances regardless.

    already-complete:
      type: bash
      depends_on: [detect-phase]
      command: echo "Cycle complete for {{inputs.topic}}. Nothing to dispatch."

    # ── Layer 3: Dispatch to sub-workflows ───────────────────

    dispatch-bugfix:
      type: skill
      skill: lattice/bug-fix-cycle
      context: inherit
      inputs:
        topic: "{{inputs.topic}}"

    dispatch-spike:
      type: skill
      skill: lattice/spike-cycle
      context: inherit
      inputs:
        topic: "{{inputs.topic}}"

    dispatch-research:
      type: skill
      skill: lattice/research-cycle
      context: inherit
      inputs:
        topic: "{{inputs.topic}}"

    dispatch-blueprint:
      type: skill
      skill: lattice/blueprint-cycle
      context: inherit
      inputs:
        topic: "{{inputs.topic}}"

    dispatch-build:
      type: skill
      skill: lattice/build-cycle
      context: inherit
      inputs:
        topic: "{{inputs.topic}}"
