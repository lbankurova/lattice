# Budget configuration for token tracking and cost alerts.
# Remove this file to disable budget checks entirely.

# Max USD per workflow run (by workflow name).
# Skill nodes that push total cost past this limit will stop the workflow.
per_workflow:
  research-cycle: 15.00
  blueprint-cycle: 10.00
  build-cycle: 10.00
  bug-fix-cycle: 8.00

# Max USD per topic (accumulated across all workflow runs for a topic).
per_topic: 40.00

# Max USD per individual node execution (by node ID).
# Useful for capping expensive nodes like research or implement.
# per_node:
#   research: 5.00
#   implement: 5.00

# Fraction of budget at which to emit a warning (0-1).
# Default: 0.8 (warn at 80% of any limit).
alert_threshold: 0.8

# Context-rot monitoring (LIT-09).
# Detects when a single Claude invocation crosses meaningful context
# utilization. The signal is per-call, distinct from cumulative USD spend:
# a workflow can stay under USD budget and still rot when individual calls
# saturate the context window, which is when autopilot decisions degrade
# silently. Block-level rot stops the workflow with a "fresh agent / /clear"
# suggestion. Cache reads are not counted against utilization.
#
# Window-size guidance:
#   200000   Claude Sonnet 4.6 / Opus 4.6 (default 200K)
#   1000000  Claude Opus 4.7 (1M context) — use this when running on Opus
#
# Uncomment to enable.
# context:
#   window_size: 1000000
#   warn_threshold: 0.6   # log a warning at 60% utilization
#   block_threshold: 0.8  # stop workflow at 80% utilization
